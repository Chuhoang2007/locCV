# LocCV needs a Node.js web server and worker; GitHub Pages cannot host them.
name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:types:local
      - run: git diff --exit-code -- src/lib/db.types.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run security:client
      - run: npm run worker:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:containers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
