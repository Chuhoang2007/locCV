services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the public URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set the public key}
    env_file: ${RUNTIME_ENV_FILE:-.env.local}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: ${RUNTIME_ENV_FILE:-.env.local}
    environment:
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3310
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
